name: Playwright Tests + Failure Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npm run test:smoke

      - name: Run Failure Analysis Agent
        run: npm run analyze:failures

      - name: Run Test Maintenance Agent
        run: npm run analyze:maintenance

      - name: Generate Maintenance Markdown Report
        run: npm run report:maintenance

      - name: Run Release Risk Agent
        run: npm run analyze:release-risk

      - name: Run Coverage Gap Agent
        run: npm run analyze:coverage
    
      - name: Run Test Generation Agent
        run: npm run generate:tests

      - name: Generate AI Summary
        run: npm run ai:summary

      # 🔥 DEPLOY DASHBOARD (THIS IS WHAT YOU WERE MISSING)
      - name: Prepare dashboard site
        run: |
          mkdir site
          cp -r dashboard/* site/
          mkdir -p site/artifacts
          cp -r artifacts/* site/artifacts/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy dashboard to GitHub Pages
        uses: actions/deploy-pages@v4

      # 📦 ARTIFACTS (KEEP THESE LAST)
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/

      - name: Upload Analysis Output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-output
          path: artifacts/
          