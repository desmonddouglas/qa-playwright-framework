name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps

      - name: Run tests
        run: npm run test:smoke

      - name: Run QA agents
        run: |
          npm run analyze:failures
          npm run analyze:maintenance
          npm run analyze:coverage
          npm run analyze:release-risk
          npm run ai:summary

      - name: Prepare site
        run: |
          mkdir site
          cp -r dashboard/* site/

          if [ -d "artifacts" ]; then
            mkdir -p site/artifacts
            cp -r artifacts/* site/artifacts/
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        uses: actions/deploy-pages@v4